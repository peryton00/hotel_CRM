name: HOTEL_CRM CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # =========================================================================
  # 1. RUST BACKEND CI (Format, Clippy, Tests, Release Build)
  # =========================================================================
  backend-ci:
    name: Rust Backend API (Axum & Tokio)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: pos_ci
          POSTGRES_DB: pos_test
        ports:
          - 5432:5432
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      POS_TEST_DATABASE_URL: postgres://postgres:pos_ci@localhost:5432/pos_test
    defaults:
      run:
        working-directory: backend/api
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.99.0
          components: clippy, rustfmt

      - name: Cache Cargo dependencies and build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend/api -> target

      - name: Verify Code Formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy Linter (-D warnings)
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Run Backend Unit & Invariant Tests
        run: cargo test --workspace --verbose

      - name: Verify local sales on PostgreSQL
        run: cargo test --locked --test offline_sale -- --ignored

      - name: Verify guest delivery between independent databases
        env:
          PGHOST: localhost
          PGUSER: postgres
          PGPASSWORD: pos_ci
          POS_SYNC_TEST_LOCAL_URL: postgres://postgres:pos_ci@localhost:5432/pos_sync
          POS_SYNC_TEST_CLOUD_URL: postgres://postgres:pos_ci@localhost:5432/guest_sync
          POS_SQLITE_TEST_CLOUD_URL: postgres://postgres:pos_ci@localhost:5432/sqlite_gateway
        run: |
          python3 ../../scripts/build_cloud_schema.py --check
          createdb pos_sync
          createdb guest_sync
          psql -v ON_ERROR_STOP=1 -d guest_sync <<'SQL'
          CREATE ROLE authenticated;
          CREATE ROLE anon;
          CREATE ROLE service_role;
          CREATE SCHEMA auth;
          CREATE TABLE auth.users(id uuid PRIMARY KEY, email text, raw_user_meta_data jsonb);
          CREATE FUNCTION auth.uid() RETURNS uuid LANGUAGE sql AS 'SELECT NULL::uuid';
          CREATE FUNCTION auth.jwt() RETURNS jsonb LANGUAGE sql AS 'SELECT NULL::jsonb';
          SQL
          psql -v ON_ERROR_STOP=1 -d guest_sync -f ../../supabase/schema.sql
          createdb -T guest_sync sqlite_gateway
          cargo test --locked --lib sqlite_shift_reconciles_on_postgres -- --ignored
          cargo test --locked --test guest_sync -- --ignored
          pg_dump -Fc -f "$RUNNER_TEMP/shift.dump" pos_sync
          createdb restored_shift
          pg_restore --exit-on-error --single-transaction -d restored_shift "$RUNNER_TEMP/shift.dump"
          test "$(psql -At -d restored_shift -c 'select count(*) from order_items')" = "$(psql -At -d pos_sync -c 'select count(*) from order_items')"

      - name: Build Release Binary
        run: cargo build --release

  # =========================================================================
  # 2. FRONTEND CI (Angular 21, Linter, Tests, Production Build)
  # =========================================================================
  frontend-ci:
    name: Angular Frontend (Angular 21 & Vitest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/restaurant-web
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/restaurant-web/package-lock.json

      - name: Install dependencies
        run: |
          npm ci
          npm install --no-save @rollup/rollup-linux-x64-gnu

      - name: Verify Prettier Code Formatting
        run: npm run lint

      - name: Run Angular Test Suite (229 Contract & Hardening Tests)
        run: npm test -- --watch=false

      - name: Compile Production Build
        run: npm run build

  # =========================================================================
  # 3. CUSTOMER MENU FRONTEND CI (Next.js 16, React 19, TypeScript Build)
  # =========================================================================
  customer-menu-ci:
    name: Customer Menu (Next.js 16 & TypeScript)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: customer-menu
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: customer-menu/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Compile Production Build & Type Check
        run: npm run build

  # =========================================================================
  # 4. SUPABASE SCHEMA VALIDATION
  # =========================================================================
  migrations-lint:
    name: Supabase Database Schemas
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify Schema Files Presence
        run: |
          echo "Checking Supabase SQL schemas in supabase/..."
          ls -la supabase/*.sql
          test -f supabase/schema.sql
          test -f supabase/mock_data.sql
          echo "All required Supabase SQL files are present and tracked."

  # =========================================================================
  # 5. DEPLOYMENT TRIGGER (Optional Webhook for Koyeb / Render)
  # =========================================================================
  deploy:
    name: Deployment Webhook Trigger
    needs: [ backend-ci, frontend-ci, customer-menu-ci, migrations-lint ]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Deployment Hook
        if: env.DEPLOY_HOOK_URL != '' || env.RENDER_DEPLOY_HOOK_URL != ''
        env:
          DEPLOY_HOOK_URL: ${{ secrets.KOYEB_DEPLOY_HOOK_URL || secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          echo "Triggering cloud service deployment webhook..."
          curl -X POST "$DEPLOY_HOOK_URL"
          echo "Deployment webhook triggered successfully."
