services:
  - type: web
    name: hotel-crm-api
    runtime: rust
    rootDir: backend/api
    buildCommand: cargo build --release --locked --bins
    startCommand: ./target/release/migrate && ./target/release/hotel_crm_api
    plan: free
    healthCheckPath: /health/ready
    envVars:
      - key: DEVICE_SYNC_TOKEN
        sync: false # Same high-entropy device credential provisioned on the till
      - key: ENVIRONMENT
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        sync: false # Set securely in Render Dashboard (Supabase PostgreSQL Connection String)
      - key: SUPABASE_JWT_SECRET
        sync: false # Set securely in Render Dashboard (Supabase JWT Secret)
      - key: SUPABASE_URL
        sync: false # Set to your Supabase Project URL
      - key: ALLOWED_ORIGINS
        sync: false # Exact HTTPS origin of the customer menu
      - key: ALLOW_DEV_AUTH
        value: "false"
