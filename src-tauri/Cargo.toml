[package]
name = "hotel_crm_desktop"
version = "0.1.0"
description = "HOTEL CRM - Desktop-First Offline Restaurant Management System"
authors = ["Antigravity Engineering"]
edition = "2021"

[lib]
name = "hotel_crm_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.12.5", features = [] }
tauri-plugin-log = "2"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
hotel_crm_api = { path = "../backend/api" }
